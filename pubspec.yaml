name: Clockin
description: "Proyek Mobile Programming"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  http: ^0.13.0
  flutter_map: ^4.0.0
  latlong2: ^0.8.1
  # foto dan kamera
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  geolocator: ^11.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  file_picker: ^8.0.0 
  # webcam: ^0.3.0
  image_picker_for_web: ^2.1.7
  dart_format: ^0.0.4
  network_info_plus: ^5.0.0
  connectivity_plus: ^4.0.1
  provider: ^6.1.5
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/main-background.jpg
    - assets/img/main-page.jpg
    - assets/img/background-dashboard.png
    - assets/img/background-profile.png
    - assets/img/background-reimburse.png
    - assets/img/logo-tanpa-tulisan.png
    - assets/img/Logo-Samping.png
    - assets/img/Data-Absensi.png
    - assets/img/Sidik-Jari-Biru.png
    - assets/img/Jam.png
    - assets/img/Beranda.png
    - assets/img/Izin.png
    - assets/img/Lembur.png
    - assets/img/Shift.png
    - assets/img/Reimburse.png
    - assets/img/Aktivitas.png
    - assets/img/Berita.png
    - assets/img/Slip-Gaji.png
    - assets/img/Visit.png
    - .env

  fonts:
    - family: Avenir
      fonts:
        - asset: assets/img/AvenirLTStd-Black.otf
          weight: 900
        - asset: assets/img/AvenirLTStd-Book.otf
          weight: 400
        - asset: assets/img/AvenirLTStd-Roman.otf
          weight: 500

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/Logo.png"